dependencies:
  idf: ">=5.5"
  # Waveshare's board package: display (HX8394 over MIPI DSI), touch (GT911),
  # LVGL through esp_lvgl_adapter, audio, and the board's pin map.
  waveshare/esp32_p4_wifi6_touch_lcd_5: "==1.0.4"
  # USB CDC-ACM device on the P4's native USB (the board's "USB OTG" port).
  espressif/esp_tinyusb: "~2.4.0"
  # The light chain (4 key lights, then the 8-light bar) over RMT.
  espressif/led_strip: "~3.0.3"
  # The board package pins LVGL to exactly 9.5.0, so Helm uses it too.
  lvgl/lvgl: "==9.5.0"
