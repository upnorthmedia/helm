<text x="20" y="896" font-size="11" fill="#555">Speaker: the one in the LCD-5 box plugs straight into SPK. Wire by the silkscreen labels.</text>
<rect x="20" y="814" width="18" height="4" fill="#e67e22"/><text x="42" y="820" font-size="11">3V3</text>
<rect x="98" y="814" width="18" height="4" fill="#d62728"/><text x="120" y="820" font-size="11">5V</text>
<rect x="176" y="814" width="18" height="4" fill="#222222"/><text x="198" y="820" font-size="11">GND</text>
<rect x="254" y="814" width="18" height="4" fill="#1f77b4"/><text x="276" y="820" font-size="11">I2C SDA</text>
<rect x="332" y="814" width="18" height="4" fill="#17becf"/><text x="354" y="820" font-size="11">I2C SCL</text>
<rect x="20" y="836" width="18" height="4" fill="#2ca02c"/><text x="42" y="842" font-size="11">key switch</text>
<rect x="150" y="836" width="18" height="4" fill="#9467bd"/><text x="172" y="842" font-size="11">light data (dashed: O to next I)</text>
<rect x="360" y="836" width="18" height="4" fill="#8c564b"/><text x="382" y="842" font-size="11">speaker</text>
<rect x="490" y="836" width="18" height="4" fill="#7f7f7f"/><text x="512" y="842" font-size="11">USB-C</text>
<text x="20" y="864" font-size="11" fill="#555">Dots are joints. Wires that cross without a dot are not connected.</text>
<text x="20" y="880" font-size="11" fill="#555">Knob VIN goes to 3V3, never 5V: its I2C pull-ups would lift the board's 3.3 V bus.</text>
</svg>
