<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Helm v2 wiring: the LCD-5 40-pin header to keys, knob, lights, speaker</title>
<rect width="840" height="900" fill="#ffffff"/>
<text x="20" y="22" font-size="15" font-weight="bold" fill="#111">Helm v2 wiring (firmware defaults: keys GPIO22 and 3-5, lights GPIO21, knob on I2C GPIO7/8)</text>
<rect x="110" y="40" width="190" height="650" rx="6" fill="#f4f4f4" stroke="#555"/>
<text x="205" y="58" text-anchor="middle" font-weight="bold">Waveshare LCD-5</text>
<text x="205" y="74" text-anchor="middle" fill="#555">40-pin header J3, 2.54 mm</text>
<text x="290" y="94" text-anchor="end" fill="#111">2  3V3</text>
<circle cx="300" cy="90" r="3.5" fill="#e67e22"/>
<text x="290" y="124" text-anchor="end" fill="#111">1  5V</text>
<circle cx="300" cy="120" r="3.5" fill="#d62728"/>
<text x="290" y="154" text-anchor="end" fill="#111">4  GPIO7 SDA</text>
<circle cx="300" cy="150" r="3.5" fill="#1f77b4"/>
<text x="290" y="184" text-anchor="end" fill="#111">5  GND (or any GND)</text>
<circle cx="300" cy="180" r="3.5" fill="#222222"/>
<text x="290" y="214" text-anchor="end" fill="#111">6  GPIO8 SCL</text>
<circle cx="300" cy="210" r="3.5" fill="#17becf"/>
<text x="290" y="244" text-anchor="end" fill="#999">7, 9  UART0 (leave)</text>
<circle cx="300" cy="240" r="3.5" fill="#bbb"/>
<text x="290" y="274" text-anchor="end" fill="#111">17  GPIO22 key YES</text>
<circle cx="300" cy="270" r="3.5" fill="#2ca02c"/>
<text x="290" y="304" text-anchor="end" fill="#999">25, 27, 30  USB, BOOT (leave)</text>
<circle cx="300" cy="300" r="3.5" fill="#bbb"/>
<text x="290" y="334" text-anchor="end" fill="#111">12  GPIO3 key LATER</text>
<circle cx="300" cy="330" r="3.5" fill="#2ca02c"/>
<text x="290" y="364" text-anchor="end" fill="#999">8  GPIO2 (touch INT, leave)</text>
<circle cx="300" cy="360" r="3.5" fill="#bbb"/>
<text x="290" y="394" text-anchor="end" fill="#111">14  GPIO4 key HOLD</text>
<circle cx="300" cy="390" r="3.5" fill="#2ca02c"/>
<text x="290" y="424" text-anchor="end" fill="#111">15  GPIO21 lights</text>
<circle cx="300" cy="420" r="3.5" fill="#9467bd"/>
<text x="290" y="454" text-anchor="end" fill="#111">11  GPIO5 key SHOW ME</text>
<circle cx="300" cy="450" r="3.5" fill="#2ca02c"/>
<text x="290" y="484" text-anchor="end" fill="#999">16  GPIO28 (spare)</text>
<circle cx="300" cy="480" r="3.5" fill="#bbb"/>
<text x="290" y="544" text-anchor="end">SPK (GH1.25 2P, lock)</text><circle cx="300" cy="540" r="3.5" fill="#8c564b"/>
<text x="120" y="604">"USB": link</text><text x="120" y="619" fill="#555" font-size="11">in the case: back jack</text><text x="120" y="644">"USB TO UART": flash</text>
